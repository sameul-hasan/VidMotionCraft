<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="460" height="220">
  <defs>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <!-- Connecting Lines -->
  <line x1="80" y1="110" x2="230" y2="110" stroke="#FF9900" stroke-width="4" stroke-dasharray="6 4"/>
  <line x1="230" y1="110" x2="380" y2="60" stroke="#38BDF8" stroke-width="4" stroke-dasharray="6 4"/>
  <line x1="230" y1="110" x2="380" y2="160" stroke="#10B981" stroke-width="4" stroke-dasharray="6 4"/>

  <!-- Node 1: EC2 Compute -->
  <g transform="translate(30, 60)">
    <rect width="100" height="100" rx="18" fill="url(#nodeGrad)" stroke="#FF9900" stroke-width="3"/>
    <text x="50" y="48" font-family="monospace" font-size="28" font-weight="900" fill="#FF9900" text-anchor="middle">EC2</text>
    <text x="50" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" text-anchor="middle">COMPUTE</text>
  </g>

  <!-- Node 2: Serverless Lambda -->
  <g transform="translate(180, 60)">
    <rect width="100" height="100" rx="18" fill="url(#nodeGrad)" stroke="#38BDF8" stroke-width="3"/>
    <text x="50" y="48" font-family="sans-serif" font-size="32" font-weight="900" fill="#38BDF8" text-anchor="middle">λ</text>
    <text x="50" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" text-anchor="middle">LAMBDA</text>
  </g>

  <!-- Node 3: S3 Storage -->
  <g transform="translate(330, 10)">
    <rect width="100" height="90" rx="18" fill="url(#nodeGrad)" stroke="#10B981" stroke-width="3"/>
    <text x="50" y="44" font-family="monospace" font-size="24" font-weight="900" fill="#10B981" text-anchor="middle">S3</text>
    <text x="50" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle">STORAGE</text>
  </g>

  <!-- Node 4: DynamoDB -->
  <g transform="translate(330, 115)">
    <rect width="100" height="90" rx="18" fill="url(#nodeGrad)" stroke="#A855F7" stroke-width="3"/>
    <text x="50" y="44" font-family="monospace" font-size="20" font-weight="900" fill="#A855F7" text-anchor="middle">DYNAMO</text>
    <text x="50" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle">DATABASE</text>
  </g>
</svg>
